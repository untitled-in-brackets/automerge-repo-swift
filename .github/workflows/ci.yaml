name: test
on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target another feature branch and need to run too.
  pull_request:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # GitHub-hosted arm64 image with its default Xcode, so the workflow runs anywhere this package is
    # forked. macOS 14 images were retired from GitHub Actions on 2026-11-02.
    # Image contents: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift tests
        run: swift test

      - name: iOS build
        # The package's consumer is an iOS app. A generic simulator destination compiles for the
        # platform without depending on a particular runtime or device being installed.
        run: >
          xcodebuild build
          -scheme automerge-repo
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
